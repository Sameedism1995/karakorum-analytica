# Karakorum Analytica — Render Blueprint (API + Streamlit dashboard)
# Repo layout: Python monorepo at root (app/ = API, dashboard/ = Streamlit UI)
# Deploy: https://render.com/deploy?repo=https://github.com/Sameedism1995/karakorum-analytica

services:
  - type: web
    name: karakorum-analytica-api
    runtime: python
    plan: free
    buildCommand: bash scripts/render_build_api.sh
    startCommand: bash scripts/start_api.sh
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: ENVIRONMENT
        value: production
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: X_POSTING_ENABLED
        value: "false"
      - key: SCHEDULER_ENABLED
        value: "true"
      - key: RUN_COLLECTION_ON_STARTUP
        value: "false"
      - key: COLLECTION_INTERVAL_MINUTES
        value: "15"
      # Ephemeral SQLite on Render (use SUPABASE_DB_URL for persistent production data)
      - key: DATABASE_URL
        value: sqlite:////tmp/karakorum-analytica.db
      - key: ALLOWED_ORIGINS
        value: http://localhost:8501,http://127.0.0.1:8501,https://karakorum-analytica-dashboard.onrender.com
      # Set in Render dashboard (Secrets) — do not commit real values:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_BUCKET_NAME
        sync: false
      - key: SUPABASE_DB_URL
        sync: false
      - key: SCRAPER_API_KEY
        sync: false
      - key: RELIEFWEB_APPNAME
        sync: false
      - key: ACLED_EMAIL
        sync: false
      - key: ACLED_API_KEY
        sync: false
      - key: SCWEET_ENABLED
        sync: false
      - key: SCWEET_USERNAME
        sync: false
      - key: SCWEET_PASSWORD
        sync: false
      - key: SCWEET_EMAIL
        sync: false
      - key: SCWEET_AUTH_TOKEN
        sync: false
      - key: SCWEET_AUTO_LOGIN
        value: "false"
      - key: SCWEET_LOGIN_HEADLESS
        value: "true"
      - key: SCWEET_COOKIES_FILE
        sync: false
      - key: SCWEET_SEARCH_QUERIES
        sync: false
      - key: SCWEET_LIMIT
        sync: false
      - key: PROXY_URLS
        sync: false

  - type: web
    name: karakorum-analytica-dashboard
    runtime: python
    plan: free
    buildCommand: bash scripts/render_build_dashboard.sh
    startCommand: bash scripts/start_dashboard.sh
    healthCheckPath: /_stcore/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: ENVIRONMENT
        value: production
      - key: APP_ENV
        value: production
      - key: API_BASE_URL
        fromService:
          name: karakorum-analytica-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      # Scweet / X — set in Render dashboard Environment (embedded mode reads these)
      - key: SCWEET_ENABLED
        value: "true"
      - key: SCWEET_USERNAME
        sync: false
      - key: SCWEET_PASSWORD
        sync: false
      - key: SCWEET_EMAIL
        sync: false
      - key: SCWEET_AUTO_LOGIN
        value: "false"
      - key: SCWEET_LOGIN_HEADLESS
        value: "true"
      - key: SCWEET_SESSION_CACHE_PATH
        value: data/scweet_session.json
      - key: SCWEET_DB_PATH
        value: data/scweet_state.db
      # Paste token from: python scripts/export_scweet_token_for_render.py
      - key: SCWEET_AUTH_TOKEN
        sync: false
