# Karakorum Analytica — Render Blueprint (API + Streamlit dashboard)
# Repo layout: Python monorepo at root (app/ = API, dashboard/ = Streamlit UI)
# Deploy: https://render.com/deploy?repo=https://github.com/Sameedism1995/karakorum-analytica

services:
  - type: web
    name: karakorum-analytica-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/init_db.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: ENVIRONMENT
        value: production
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: X_POSTING_ENABLED
        value: "false"
      - key: SCHEDULER_ENABLED
        value: "true"
      - key: RUN_COLLECTION_ON_STARTUP
        value: "true"
      - key: COLLECTION_INTERVAL_MINUTES
        value: "15"
      # Ephemeral SQLite on Render (use SUPABASE_DB_URL for persistent production data)
      - key: DATABASE_URL
        value: sqlite:////tmp/karakorum-analytica.db
      - key: ALLOWED_ORIGINS
        value: http://localhost:8501,http://127.0.0.1:8501,https://karakorum-analytica-dashboard.onrender.com
      # Set in Render dashboard (Secrets) — do not commit real values:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_BUCKET_NAME
        sync: false
      - key: SUPABASE_DB_URL
        sync: false
      - key: SCRAPER_API_KEY
        sync: false
      - key: RELIEFWEB_APPNAME
        sync: false
      - key: ACLED_EMAIL
        sync: false
      - key: ACLED_API_KEY
        sync: false

  - type: web
    name: karakorum-analytica-dashboard
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run dashboard/streamlit_app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: ENVIRONMENT
        value: production
      - key: API_BASE_URL
        fromService:
          name: karakorum-analytica-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
