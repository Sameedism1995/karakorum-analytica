# Deploy API + Streamlit dashboard on Render (free tier).
# One Blueprint deploy → two public URLs. See DEPLOY.md
services:
  - type: web
    name: pakistan-osint-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/init_db.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: X_POSTING_ENABLED
        value: "false"
      - key: SCHEDULER_ENABLED
        value: "true"
      - key: RUN_COLLECTION_ON_STARTUP
        value: "true"
      - key: COLLECTION_INTERVAL_MINUTES
        value: "15"
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        value: sqlite:///./local.db
      # Optional — add in Render dashboard after deploy:
      # RELIEFWEB_APPNAME, ACLED_EMAIL, ACLED_API_KEY
      # SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, SUPABASE_DB_URL

  - type: web
    name: pakistan-osint-dashboard
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run dashboard/streamlit_app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: API_BASE_URL
        fromService:
          name: pakistan-osint-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
